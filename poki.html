<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Block &amp; Destroy</title>
<!-- ============================================================================
     POKI BUILD ENTRY (poki.html)
     A dedicated entry point for publishing on Poki (https://poki.com). Differences
     from index.html:
       • Loads the Poki SDK (game-cdn.poki.com) BEFORE the game bundle.
       • Sets window.CA_PORTAL='poki' so the game hides outward links / its own
         share + share-URL (Poki policy: keep the player on Poki, no external ads).
       • Does NOT register the service worker (Poki serves the game inside its own
         sandboxed iframe — a SW + app-shell cache there is unnecessary and risky).
       • Boots, then calls CA.Ads.init() which detects PokiSDK, runs PokiSDK.init()
         and PokiSDK.gameLoadingFinished(); rewarded() / interstitial() then route
         through the Poki SDK (see js/ads.js portal adapter).
     The standalone web build keeps using index.html and is unaffected.
     ============================================================================ -->
<link rel="icon" href="assets/block-icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#315d2f">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/menu.css">

<!-- Poki SDK — must load before the game so window.PokiSDK exists at boot. -->
<script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
<script>window.CA_PORTAL = 'poki';</script>

<style>
  /* brand/boot splash (same as index.html, trimmed — no debug console) */
  #boot-splash{position:fixed;inset:0;z-index:9999;background:#0e1217;transition:opacity .5s ease;}
  #boot-splash .bs-stage{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:8px;text-align:center;padding:6vw;box-sizing:border-box;}
  #boot-splash .bs-brand{animation:bs-brand 1.8s ease both;}
  #boot-splash .bs-co{font:800 clamp(22px,5vw,42px)/1.12 'Baloo 2',system-ui,-apple-system,sans-serif;
    color:#ffd45c;letter-spacing:.5px;text-shadow:0 3px 0 #176ac2,0 7px 22px rgba(0,0,0,.65);}
  #boot-splash .bs-sub{font:600 clamp(11px,2vw,14px) system-ui,-apple-system,sans-serif;
    color:#b9a89a;letter-spacing:3px;text-transform:uppercase;opacity:.85;}
  #boot-splash .bs-rule{width:min(60vw,260px);height:2px;
    background:linear-gradient(90deg,transparent,#178eea,#ffd45c,#178eea,transparent);border-radius:2px;}
  #boot-splash .bs-wordmark{opacity:0;text-align:center;text-transform:uppercase;
    font:1000 clamp(34px,9vw,82px)/.78 Impact,'Arial Black',system-ui,sans-serif;
    color:#d9ded5;-webkit-text-stroke:1px #20271f;
    text-shadow:0 4px 0 #6f776b,0 8px 0 #252c24,0 16px 28px rgba(0,0,0,.6);
    animation:bs-logo 1.55s ease 1.6s both;}
  #boot-splash .bs-wordmark b{display:block;color:#77bd4e;text-shadow:0 4px 0 #3e762c,0 8px 0 #1f3e1a,0 16px 28px rgba(0,0,0,.6);}
  #boot-splash .bs-wordmark span{display:block;font-size:.53em;letter-spacing:4px;margin-top:18px;}
  #boot-splash .bs-mark{height:clamp(126px,24vw,192px);width:auto;margin-bottom:2px;
    filter:drop-shadow(0 4px 14px rgba(0,0,0,.5));}
  #boot-splash.bs-hide{opacity:0;pointer-events:none;}
  @keyframes bs-brand{0%{opacity:0;transform:translateY(10px) scale(.96)}15%{opacity:1;transform:none}
    68%{opacity:1;transform:none}100%{opacity:0;transform:scale(1.02)}}
  @keyframes bs-logo{0%{opacity:0;transform:scale(.9)}28%{opacity:1;transform:scale(1)}
    70%{opacity:1;transform:scale(1.015)}100%{opacity:0;transform:scale(1.04)}}
  @media (prefers-reduced-motion:reduce){
    #boot-splash .bs-brand{animation:none;} #boot-splash .bs-wordmark{animation:none;opacity:0;}
  }
</style>
</head>
<body>
  <div id="boot-splash">
    <div class="bs-stage bs-brand">
      <img class="bs-mark" src="assets/benjam-games-logo.png?v=0.2.3" alt="BenJam Games — two brothers shaking hands">
      <div class="bs-co">BenJam Games</div>
      <div class="bs-rule"></div>
      <div class="bs-sub">presents</div>
    </div>
    <div class="bs-stage"><div class="bs-wordmark" aria-label="Block and Destroy"><b>Block</b><span>&amp; Destroy</span></div></div>
  </div>

  <div id="game-wrap">
    <canvas id="game"></canvas>
    <button id="fs-btn" title="Fullscreen (F)">⛶</button>
    <div id="rotate-hint">
      <div class="rh-card">
        <div class="rh-phone">📱</div>
        <div class="rh-label">Rotate your phone to landscape!</div>
      </div>
    </div>
  </div>
  <div id="menu-root"></div>

  <!-- Poki build always loads the production bundle (no localhost dev-file path). -->
  <script src="bundle.min.js?v=0.2.3"></script>
  <script>
    (function(){
      // NO service worker on Poki (sandboxed iframe; app-shell cache is unwanted).
      window.addEventListener('load', function(){
        // safety net: never let the splash hang.
        setTimeout(function(){
          var sp=document.getElementById('boot-splash');
          if(sp){ sp.classList.add('bs-hide'); setTimeout(function(){ if(sp&&sp.parentNode) sp.parentNode.removeChild(sp); }, 520); }
        }, 4000);

        try { CA.boot(document.getElementById('game')); }
        catch(e){ /* splash safety timeout handles a fatal load */ }

        // (CA.Ads.init() REMOVED — CA.boot already runs CA.Portal.init(), which
        // does PokiSDK.init() + gameLoadingFinished(); calling CA.Ads.init too
        // double-inited the SDK against Poki's init-once guidance.)

        // account + entitlement (best-effort; harmless on Poki)
        var _t0=Date.now(), _acctDone=false, _splashGone=false, INTRO_MS=3200;
        function reveal(){ if(_splashGone||!_acctDone) return;
          var wait=INTRO_MS-(Date.now()-_t0); if(wait>0){ setTimeout(reveal, wait); return; }
          _splashGone=true; var sp=document.getElementById('boot-splash'); if(!sp) return;
          sp.classList.add('bs-hide'); setTimeout(function(){ if(sp&&sp.parentNode) sp.parentNode.removeChild(sp); }, 520); }
        function acctDone(){ _acctDone=true; reveal(); }
        if (CA.Account && CA.Account.init) { try { var _ap=CA.Account.init(); if(_ap&&_ap.then){ _ap.then(acctDone, acctDone); } else acctDone(); } catch(e){ acctDone(); } }
        else acctDone();
        setTimeout(acctDone, 3000);
        if (CA.Entitlement && CA.Entitlement.init) { try { CA.Entitlement.init(); } catch(e){} }

        // start at menu (fallback auto-start if the menu renderer is absent)
        if (!CA.UI || !CA.UI.renderMenu) { try { CA.newGame({ vsAI:true, aiLevel:1 }); } catch(e){} }

        var fs=document.getElementById('fs-btn');
        if(fs) fs.addEventListener('click', function(){ if (CA.toggleFullscreen) CA.toggleFullscreen(); });
      });
    })();
  </script>
</body>
</html>
